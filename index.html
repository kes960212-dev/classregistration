/* ===================== CSV ===================== */
function csvCell(v){
  var s = (v==null) ? "" : String(v);
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCSV(rows){ return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n"); }
function classTag(){
  var c = S.cls;
  return [(c.grade?c.grade+"학년":""), (c.klass?c.klass+"반":"")].filter(Boolean).join(" ") || "우리 반";
}
function buildAttCSV(months){
  var rows = [[classTag()+" 출결", "기준일 "+todayISO()]];
  months.forEach(function(ym){
    var n = daysInMonth(ym), p = ym.split("-"), i;
    var used = false;
    for (i=1;i<=n;i++){ if (S.att[ym+"-"+pad(i)]) { used = true; break; } }
    if (!used) return;
    rows.push([]); rows.push([p[0]+"년 "+(+p[1])+"월"]);
    var head = ["번호","이름"];
    for (i=1;i<=n;i++) head.push(String(i));
    head.push("출석","결석","지각","조퇴","결과","체험");
    rows.push(head);
    S.roster.slice().sort(byNo).forEach(function(st){
      var r = [st.no, st.name], sum = {P:0,A:0,L:0,E:0,R:0,X:0};
      for (i=1;i<=n;i++){
        var t = attOf(ym+"-"+pad(i), st.id);
        if (t && sum[t]!==undefined) sum[t]++;
        r.push(ATT[t] ? ATT[t].mk : "");
      }
      r.push(sum.P, sum.A, sum.L, sum.E, sum.R, sum.X);
      rows.push(r);
    });
  });
  rows.push([]); rows.push(["결석·지각 상세"]); rows.push(["날짜","요일","번호","이름","구분","사유구분","사유"]);
  months.forEach(function(ym){
    Object.keys(S.att).filter(function(dt){ return ymOf(dt)===ym; }).sort().forEach(function(dt){
      S.roster.slice().sort(byNo).forEach(function(st){
        var rec = S.att[dt][st.id];
        if (!rec || !rec.t || rec.t === "P") return;
        rows.push([dt, DOW[dowOf(dt)], st.no, st.name, ATT[rec.t].name, rec.rk||"", rec.r||""]);
      });
    });
  });
  /* 나이스 마감용 집계 */
  rows.push([]); rows.push(["사유별 집계 (나이스 입력용)"]);
  rows.push(["번호","이름","구분","질병","미인정","기타","출석인정","미분류","계"]);
  S.roster.slice().sort(byNo).forEach(function(st){
    [["A","결석"],["L","지각"],["E","조퇴"],["R","결과"],["X","체험"]].forEach(function(pair){
      var cells = {"질병":0,"미인정":0,"기타":0,"출석인정":0,"미분류":0}, tot = 0;
      months.forEach(function(ym){
        Object.keys(S.att).filter(function(dt){ return ymOf(dt)===ym; }).forEach(function(dt){
          var rec = S.att[dt][st.id];
          if (!rec || rec.t !== pair[0]) return;
          cells[rec.rk || "미분류"]++; tot++;
        });
      });
      if (!tot) return;
      rows.push([st.no, st.name, pair[1], cells["질병"], cells["미인정"], cells["기타"],
                 cells["출석인정"], cells["미분류"], tot]);
    });
  });
  return toCSV(rows);
}
function buildObsCSV(){
  var rows = [[classTag()+" 학생 기록", "기준일 "+todayISO()], [], ["누가기록"], ["번호","이름","날짜","영역","내용"]];
  S.roster.slice().sort(byNo).forEach(function(st){
    (S.obs[st.id]||[]).slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; })
      .forEach(function(e){ rows.push([st.no, st.name, e.date, e.cat, e.text]); });
  });
  rows.push([]); rows.push(["상담"]);
  rows.push(["번호","이름","날짜","대상","방법","내용","후속조치"]);
  S.roster.slice().sort(byNo).forEach(function(st){
    S.counsel.filter(function(c){ return c.sid === st.id; })
      .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); })
      .forEach(function(c){ rows.push([st.no, st.name, c.date||"", c.target||"", c.way||"", c.text||"", c.follow||""]); });
  });
  return toCSV(rows);
}
function buildJournalCSV(months){
  var rows = [[classTag()+" 학급일지", "기준일 "+todayISO()], [],
    ["날짜","요일","날씨","행사","재적","등교","결석","지각","조퇴","결과","체험","알림장","할 일","일지 본문"]];
  var set = {};
  months.forEach(function(m){ set[m] = 1; });
  Object.keys(S.days).sort().forEach(function(dt){
    if (!set[ymOf(dt)]) return;
    var d = S.days[dt], c = attCounts(dt);
    var notices = (d.notices||[]).filter(nonEmpty).map(function(x,i){ return (i+1)+". "+x.t; }).join("\n");
    var todos = (d.todos||[]).filter(nonEmpty).map(function(x){ return (x.done?"[완료] ":"[ ] ")+x.t; }).join("\n");
    var body = d.diary || "";
    if (!notices && !todos && !body.trim() && !c.marked && !d.w && !(d.event||"").trim()) return;
    rows.push([dt, DOW[dowOf(dt)], d.w||"", d.event||"", c.total, c.present, c.A, c.L, c.E, c.R, c.X, notices, todos, body]);
  });
  return toCSV(rows);
}
function buildLessonCSV(months){
  var rows = [[classTag()+" 수업기록", "기준일 "+todayISO()], [], ["날짜","요일","교시","교과","학습내용","행사"]];
  var set = {};
  months.forEach(function(m){ set[m] = 1; });
  Object.keys(S.lessons).sort().forEach(function(dt){
    if (!set[ymOf(dt)]) return;
    var day = S.lessons[dt];
    var ev = (S.days[dt]||{}).event || "";
    Object.keys(day).sort(function(a,b){ return a-b; }).forEach(function(p){
      var c = day[p];
      if (!c || (!String(c.sub||"").trim() && !String(c.txt||"").trim())) return;
      rows.push([dt, DOW[dowOf(dt)], p, c.sub||"", c.txt||"", ev]);
      ev = "";
    });
  });
  return toCSV(rows);
}
function buildEvalCSV(){
  var rows = [[classTag()+" 평가", "기준일 "+todayISO()], [], ["평가계획"],
    ["교과","평가명","영역·단원","성취기준","평가방법","시기","구분"]];
  S.plans.forEach(function(p){
    rows.push([p.subject||"", p.name, p.unit||"", p.standard||"", p.method||"", p.term||"", p.kind||"수행"]);
  });
  rows.push([]); rows.push(["평가 기록"]);
  rows.push(["평가명","구분","번호","이름","성취도","점수","관찰내용"]);
  S.plans.forEach(function(p){
    var bag = S.scores[p.name];
    if (!bag) return;
    S.roster.slice().sort(byNo).forEach(function(s){
      var v = bag[s.id];
      if (!v || (!v.g && !v.s && !v.c)) return;
      rows.push([p.name, p.kind||"수행", s.no, s.name, v.g||"", v.s||"", v.c||""]);
    });
  });
  /* 단원평가 교과별 평균 */
  var bySub = {};
  S.plans.filter(function(p){ return p.kind === "단원"; }).forEach(function(p){
    var bag = S.scores[p.name] || {};
    var nums = [];
    S.roster.forEach(function(s){
      var v = parseFloat((bag[s.id]||{}).s);
      if (!isNaN(v)) nums.push(v);
    });
    if (!nums.length) return;
    var avg = nums.reduce(function(a,b){ return a+b; },0)/nums.length;
    var key = p.subject || "기타";
    if (!bySub[key]) bySub[key] = [];
    bySub[key].push({name:p.name, avg:avg, n:nums.length});
  });
  var subs = Object.keys(bySub);
  if (subs.length){
    rows.push([]); rows.push(["단원평가 평균"]);
    rows.push(["교과","평가명","응시 인원","평균"]);
    subs.forEach(function(k){
      bySub[k].forEach(function(x){ rows.push([k, x.name, x.n, x.avg.toFixed(1)]); });
    });
  }
  return toCSV(rows);
}
function buildTaskCSV(){
  var rows = [[classTag()+" 업무·예산", "기준일 "+todayISO()], [], ["업무"],
    ["등록일","구분","업무명","담당","마감일","D-day","상태","관련예산","문서번호","메모","링크"]];
  S.tasks.slice().sort(function(a,b){
    var A = isDate(a.due)?a.due:"9999", B = isDate(b.due)?b.due:"9999";
    return A.localeCompare(B);
  }).forEach(function(t){
    var d = dday(t.due);
    rows.push([t.reg||"", t.kind||"", t.name, t.owner||"", t.due||"",
      (d===null?"":(d<0?"D+"+(-d):"D-"+d)), t.status||"", t.budget||"", t.docno||"", t.memo||"", t.link||""]);
  });
  rows.push([]); rows.push(["예산"]);
  rows.push(["사업명","재원","배정액","집행액","잔액","집행률(%)"]);
  var tA = 0, tU = 0;
  S.budgets.forEach(function(b){
    var a = won(b.amount), u = spentOn(b.name);
    tA += a; tU += u;
    rows.push([b.name, b.source||"", a, u, a-u, a>0?Math.round(u/a*100):0]);
  });
  if (S.budgets.length) rows.push(["합계","",tA,tU,tA-tU, tA>0?Math.round(tU/tA*100):0]);
  rows.push([]); rows.push(["집행 내역"]);
  rows.push(["날짜","사업명","내용","금액","증빙","비고"]);
  S.spends.slice().sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); })
    .forEach(function(x){ rows.push([x.date||"", x.budget||"", x.item||"", won(x.amount), x.proof||"", x.note||""]); });
  return toCSV(rows);
}
function buildRefCSV(){
  var c = S.cls;
  var rows = [[classTag()+" 학급 기본 정보", "기준일 "+todayISO()], [],
    ["학교", c.school||""], ["학년", c.grade||""], ["반", c.klass||""], ["담임", c.teacher||""], [],
    ["명렬"], ["번호","이름","성별","비고"]];
  S.roster.slice().sort(byNo).forEach(function(s){ rows.push([s.no, s.name, s.sex||"", s.note||""]); });
  rows.push([]); rows.push(["시간표"]); rows.push(["교시","월","화","수","목","금"]);
  for (var p=0;p<(S.tt.periods||7);p++){
    var r = [p+1];
    for (var d=0;d<5;d++) r.push((S.tt.grid[d] && S.tt.grid[d][p]) || "");
    rows.push(r);
  }
  rows.push([]); rows.push(["자리배치 (칠판 쪽이 첫 줄)"]);
  for (var y=0;y<S.seat.rows;y++){
    var rr = [];
    for (var x=0;x<S.seat.cols;x++){
      var sid = S.seat.cells[y*S.seat.cols+x], st = sid ? byId(sid) : null;
      rr.push(st ? (st.no+" "+st.name) : "");
    }
    rows.push(rr);
  }
  return toCSV(rows);
}
function expLogAdd(html){
  var d = new Date();
  S.expLog.unshift({time: pad(d.getHours())+":"+pad(d.getMinutes()), html: html});
  S.expLog = S.expLog.slice(0,12);
  if (S.tab === "exp") render();
}
function runExport(kind, btn){
  var meta = EXPORTS.filter(function(x){ return x.k===kind; })[0];
  var months = monthList(S.expPreset, S.expMonth);
  var mp = S.expMonth.split("-");
  var label = S.expPreset==="month" ? (mp[0]+"년 "+(+mp[1])+"월")
    : S.expPreset==="sem1" ? acadYear()+"학년도 1학기"
    : S.expPreset==="sem2" ? acadYear()+"학년도 2학기" : acadYear()+"학년도";
  var title = classTag()+" "+meta.t+(meta.period ? " "+label : "");
  var csv = kind==="att" ? buildAttCSV(months)
    : kind==="obs" ? buildObsCSV()
    : kind==="journal" ? buildJournalCSV(months)
    : kind==="lesson" ? buildLessonCSV(months)
    : kind==="eval" ? buildEvalCSV()
    : kind==="task" ? buildTaskCSV()
    : buildRefCSV();
  try{
    var blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = title + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    expLogAdd("<b>"+esc(title)+"</b> 파일로 내려받았습니다.");
  }catch(err){
    expLogAdd('<span style="color:var(--danger)">'+esc(title)+' — 내려받지 못했습니다.</span>');
  }
}
