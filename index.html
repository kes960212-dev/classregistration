<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 하루 — 학급일지</title>
<meta name="description" content="학급일지·알림장·할 일·출결·누가기록·시간표·자리배치를 하루 단위로 관리하는 담임 교사용 학급 운영 도구">
<meta name="theme-color" content="#2E6A56">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%93%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F1F3EF;
  --surface:#FFFFFF;
  --surface-2:#F7F8F4;
  --line:#DDE1D8;
  --line-strong:#C3CABB;
  --ink:#1C2420;
  --ink-2:#4C574F;
  --ink-3:#7E897F;
  --accent:#2E6A56;
  --accent-2:#4C8E77;
  --accent-soft:#E1EBE5;
  --warn:#A96A12;
  --warn-soft:#F6ECDC;
  --danger:#A63D3D;
  --danger-soft:#F6E4E3;
  --info:#35618C;
  --info-soft:#E1EAF3;
  --late:#7A6096;
  --late-soft:#EDE7F3;
  --board:#26382F;
  --radius:10px;
  --shadow:0 1px 2px rgba(28,36,32,.05), 0 10px 26px -18px rgba(28,36,32,.45);
  --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121614; --surface:#1A201D; --surface-2:#212925;
    --line:#2D362F; --line-strong:#3F4A42;
    --ink:#E7ECE8; --ink-2:#AFBAB3; --ink-3:#818E86;
    --accent:#74C2A2; --accent-2:#8FD3B6; --accent-soft:#22332C;
    --warn:#D8A055; --warn-soft:#33291A;
    --danger:#DE8484; --danger-soft:#37211F;
    --info:#8AB0D6; --info-soft:#1C2833;
    --late:#B79BD3; --late-soft:#282133;
    --board:#141C18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#121614; --surface:#1A201D; --surface-2:#212925;
  --line:#2D362F; --line-strong:#3F4A42;
  --ink:#E7ECE8; --ink-2:#AFBAB3; --ink-3:#818E86;
  --accent:#74C2A2; --accent-2:#8FD3B6; --accent-soft:#22332C;
  --warn:#D8A055; --warn-soft:#33291A;
  --danger:#DE8484; --danger-soft:#37211F;
  --info:#8AB0D6; --info-soft:#1C2833;
  --late:#B79BD3; --late-soft:#282133;
  --board:#141C18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0; padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
img{max-width:100%}
button,input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:206px 1fr; min-height:100vh}
.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:2px; padding:18px 12px 24px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:4px 10px 18px; display:flex; flex-direction:column; gap:2px}
.brand b{font-family:var(--serif); font-size:20px; font-weight:700; letter-spacing:.01em}
.brand span{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.navbtn{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:9px 11px; border:0; border-radius:8px; background:transparent;
  color:var(--ink-2); font-size:14px; font-weight:500; text-align:left; cursor:pointer;
}
.navbtn:hover{background:var(--surface-2); color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:700}
.navbtn i{width:18px; text-align:center; font-style:normal; font-size:15px; opacity:.85}
.railfoot{margin-top:auto; padding:14px 11px 0; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-3); line-height:1.5}
.railfoot b{display:block; color:var(--ink-2); font-weight:500; font-size:12px}

.main{min-width:0; padding-block:22px 64px; padding-left:28px; padding-right:28px}
.topbar{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.topbar h1{margin:0; font-family:var(--serif); font-size:26px; font-weight:700; letter-spacing:-.01em}
.topbar p{margin:0; color:var(--ink-3); font-size:13px}
.savechip{
  margin-left:auto; font-size:11.5px; font-family:var(--mono); color:var(--ink-3);
  border:1px solid var(--line); border-radius:99px; padding:3px 10px; background:var(--surface);
  white-space:nowrap; cursor:default;
}
.savechip[data-state="saving"]{color:var(--accent); border-color:var(--accent)}
.savechip[data-state="local"]{color:var(--warn); border-color:var(--warn)}
.savechip[data-state="error"]{color:var(--danger); border-color:var(--danger); cursor:pointer}

/* ---------- primitives ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.panel > header{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line)}
.panel > header h2{margin:0; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); white-space:nowrap}
.panel > header .sub{font-size:12px; color:var(--ink-3); font-weight:400; letter-spacing:0; text-transform:none; min-width:0}
.panel > header .spacer{margin-left:auto}
.pbody{padding:16px}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}

.btn{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2);
  padding:6px 12px; border-radius:7px; font-size:13px; font-weight:500; cursor:pointer;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn:disabled{opacity:.55; cursor:default}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-2); border-color:var(--accent-2); color:#fff}
.btn.ghost{border-color:transparent; color:var(--ink-3)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.tiny{padding:3px 8px; font-size:12px}
.btn.danger{color:var(--danger); border-color:var(--danger)}
.btn.danger:hover{background:var(--danger); color:#fff; border-color:var(--danger)}

.field{display:flex; flex-direction:column; gap:5px}
.field > label{font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
.input, textarea.input, select.input{
  width:100%; background:var(--surface-2); border:1px solid var(--line);
  border-radius:7px; padding:8px 11px; font-size:14px;
}
.input:focus{background:var(--surface); border-color:var(--accent); outline:none}
textarea.input{resize:vertical; line-height:1.75}

.empty{color:var(--ink-3); font-size:13.5px; padding:18px 4px; text-align:center}
.notice{
  display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius);
  background:var(--warn-soft); border:1px solid color-mix(in srgb, var(--warn) 35%, transparent);
  font-size:13.5px; color:var(--ink-2);
}
.notice b{color:var(--warn)}
.notice.bad{background:var(--danger-soft); border-color:color-mix(in srgb, var(--danger) 35%, transparent)}
.notice.bad b{color:var(--danger)}
.notice.good{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 35%, transparent)}
.notice.good b{color:var(--accent)}

/* ---------- gate ---------- */
.gate{min-height:100vh; display:grid; place-items:center; padding:24px 16px}
.gatecard{width:100%; max-width:380px}
.gatecard .brand{padding:0 0 18px; text-align:center; align-items:center}
.gatecard .brand b{font-size:26px}

/* ---------- ledger ---------- */
.ledger{
  display:grid; grid-template-columns:auto auto 1fr repeat(5, minmax(52px,auto));
  border:1px solid var(--line-strong); border-radius:var(--radius); overflow:hidden;
  background:var(--surface); box-shadow:var(--shadow);
}
.lcell{padding:9px 14px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:1px; min-width:0}
.lcell:last-child{border-right:0}
.lcell .lk{font-size:10.5px; letter-spacing:.12em; color:var(--ink-3); text-transform:uppercase; white-space:nowrap}
.lcell .lv{font-family:var(--serif); font-size:19px; font-weight:700; line-height:1.25; white-space:nowrap}
.lcell.num .lv{font-family:var(--mono); font-size:17px; font-variant-numeric:tabular-nums}
.lcell.date{background:var(--accent-soft)}
.lcell.date .lv{color:var(--accent)}
.lcell.wx{justify-content:center}
.datenav{display:flex; align-items:center; gap:4px; margin-top:2px}
.datenav input[type="date"]{border:0; background:transparent; font-family:var(--mono); font-size:12px; color:var(--ink-3); padding:0; width:120px}
.iconbtn{
  border:1px solid var(--line); background:var(--surface); border-radius:6px; width:24px; height:24px;
  display:grid; place-items:center; cursor:pointer; color:var(--ink-2); font-size:13px; line-height:1; padding:0;
}
.iconbtn:hover{border-color:var(--accent); color:var(--accent)}
.wxrow{display:flex; gap:3px; flex-wrap:wrap}
.wx-b{border:1px solid transparent; background:transparent; border-radius:6px; padding:3px 6px; font-size:12.5px; cursor:pointer; color:var(--ink-3)}
.wx-b:hover{background:var(--surface-2)}
.wx-b[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:700; border-color:color-mix(in srgb,var(--accent) 30%,transparent)}

/* ---------- today ---------- */
.today{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:16px; margin-top:16px; align-items:start}
.linelist{display:flex; flex-direction:column; gap:6px}
.lineitem{display:flex; align-items:center; gap:8px}
.lineitem .idx{font-family:var(--mono); font-size:12px; color:var(--ink-3); width:20px; flex:0 0 20px; text-align:right; font-variant-numeric:tabular-nums}
.lineitem input[type="text"]{flex:1; min-width:0; border:0; border-bottom:1px solid var(--line); background:transparent; padding:5px 2px; font-size:14px}
.lineitem input[type="text"]:focus{outline:none; border-bottom-color:var(--accent)}
.lineitem .btn.ghost{opacity:0; flex:0 0 auto}
.lineitem:hover .btn.ghost, .lineitem:focus-within .btn.ghost{opacity:1}

.todo{display:flex; align-items:flex-start; gap:9px; padding:3px 0}
.todo input[type="checkbox"]{margin-top:7px; accent-color:var(--accent); width:15px; height:15px; flex:0 0 auto}
.todo input[type="text"]{flex:1; min-width:0; border:0; background:transparent; padding:4px 2px; font-size:14px; border-bottom:1px solid transparent}
.todo input[type="text"]:focus{outline:none; border-bottom-color:var(--accent)}
.todo.done input[type="text"]{text-decoration:line-through; color:var(--ink-3)}
.carry{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line-strong)}
.carry .ck{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--warn); font-weight:700; margin-bottom:4px}
.carry .citem{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--ink-2); padding:2px 0}
.carry .cd{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); flex:0 0 auto}

/* ---------- attendance ---------- */
.attgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(114px,1fr)); gap:6px}
.stu{display:flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface-2); border-radius:7px; padding:6px 8px; cursor:pointer; text-align:left; min-width:0}
.stu:hover{border-color:var(--line-strong)}
.stu .no{font-family:var(--mono); font-size:11px; color:var(--ink-3); flex:0 0 auto; font-variant-numeric:tabular-nums}
.stu .nm{font-size:13.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.stu .mk{font-size:11px; font-weight:700; border-radius:4px; padding:1px 5px; flex:0 0 auto}
.stu[data-t="A"]{background:var(--danger-soft); border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.stu[data-t="A"] .mk{color:var(--danger)}
.stu[data-t="L"]{background:var(--late-soft); border-color:color-mix(in srgb,var(--late) 40%,transparent)}
.stu[data-t="L"] .mk{color:var(--late)}
.stu[data-t="E"]{background:var(--info-soft); border-color:color-mix(in srgb,var(--info) 40%,transparent)}
.stu[data-t="E"] .mk{color:var(--info)}
.stu[data-t="R"]{background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.stu[data-t="R"] .mk{color:var(--warn)}
.stu[data-t="P"]{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.stu[data-t="P"] .mk{color:var(--accent)}
.stu[data-t="X"]{background:var(--info-soft); border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.stu[data-t="X"] .mk{color:var(--info)}
table.month td.cell[data-t="P"]{background:var(--accent-soft); color:var(--accent)}
table.month td.cell[data-t="X"]{background:var(--info-soft); color:var(--info)}

.reasons{display:flex; flex-direction:column; gap:7px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
.reasonrow{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.reasonrow .who{font-size:13.5px; font-weight:500; min-width:88px}
.reasonrow .tag{font-size:11px; font-weight:700; border-radius:4px; padding:2px 7px}
.reasonrow input{flex:1; min-width:150px}

.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}
table.month{border-collapse:separate; border-spacing:0; font-size:12.5px; width:max-content; min-width:100%}
table.month th, table.month td{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:0; text-align:center}
table.month thead th{position:sticky; top:0; z-index:2; background:var(--surface-2); font-weight:500; color:var(--ink-3); font-family:var(--mono); font-size:11px; padding:6px 0; min-width:26px}
table.month thead th.wk{color:var(--danger)}
table.month th.nmcol, table.month td.nmcol{position:sticky; left:0; z-index:1; background:var(--surface); text-align:left; padding:5px 10px; min-width:104px; border-right:1px solid var(--line-strong); white-space:nowrap}
table.month thead th.nmcol{z-index:3; background:var(--surface-2)}
table.month td.nmcol .no{font-family:var(--mono); color:var(--ink-3); font-size:11px; margin-right:6px}
table.month td.cell{cursor:pointer; height:27px; font-weight:700; font-size:11.5px; color:var(--ink-3)}
table.month td.cell:hover{background:var(--accent-soft)}
table.month td.cell[data-t="A"]{background:var(--danger-soft); color:var(--danger)}
table.month td.cell[data-t="L"]{background:var(--late-soft); color:var(--late)}
table.month td.cell[data-t="E"]{background:var(--info-soft); color:var(--info)}
table.month td.cell[data-t="R"]{background:var(--warn-soft); color:var(--warn)}
table.month td.cell.wkend{background:color-mix(in srgb, var(--line) 55%, transparent)}
table.month td.sum{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink-2); padding:0 7px; min-width:30px}
table.month tbody tr:hover td.nmcol{background:var(--surface-2)}

.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--ink-3); margin-top:10px}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:13px; height:13px; border-radius:3px; display:inline-block; font-style:normal}

/* ---------- 수업 주간표 ---------- */
table.week{border-collapse:separate; border-spacing:0; width:100%; min-width:900px; background:var(--surface)}
table.week th, table.week td{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:0; vertical-align:top}
table.week thead th{
  position:sticky; top:0; z-index:2; background:var(--surface-2); padding:7px 6px; text-align:center;
  font-weight:500; color:var(--ink-2);
}
table.week thead th .wd{display:block; font-size:13px; font-weight:700}
table.week thead th .dd{display:block; font-family:var(--mono); font-size:11px; color:var(--ink-3)}
table.week th.rowlab{
  position:sticky; left:0; z-index:1; background:var(--surface-2); width:78px; min-width:78px;
  font-size:11.5px; font-weight:500; color:var(--ink-3); text-align:center; padding:8px 5px; line-height:1.45;
  border-right:1px solid var(--line-strong); white-space:nowrap;
}
table.week thead th.rowlab{z-index:3}
table.week th.rowlab.per{font-family:var(--mono); font-size:13px; color:var(--ink-2)}
table.week td.todaycol, table.week thead th.todaycol{background:var(--accent-soft)}
table.week thead th.todaycol .wd{color:var(--accent)}
table.week tr.meta td{background:var(--surface-2)}
table.week tr.meta td.todaycol{background:color-mix(in srgb, var(--accent-soft) 70%, var(--surface-2))}
table.week input.evt{
  width:100%; border:0; background:transparent; padding:7px 8px; font-size:12.5px; text-align:center; color:var(--ink-2);
}
table.week input.evt:focus{outline:none; background:var(--surface)}
table.week button.jump{
  width:100%; min-height:34px; border:0; background:transparent; text-align:left; cursor:pointer;
  padding:7px 8px; font:inherit; font-size:12px; line-height:1.55; color:var(--ink-2); white-space:pre-wrap; word-break:break-word;
}
table.week button.jump:hover{background:var(--surface)}
table.week button.jump .dim{color:var(--ink-3)}
.lcellbox{display:flex; flex-direction:column; min-width:130px}
.lcellbox input.lsub{
  border:0; border-bottom:1px dotted var(--line); background:transparent; padding:5px 8px 3px;
  font-size:11.5px; font-weight:700; color:var(--accent); letter-spacing:.02em;
}
.lcellbox input.lsub::placeholder{color:var(--ink-3); font-weight:400}
.lcellbox input.lsub:focus{outline:none; background:var(--surface)}
.lcellbox textarea.ltxt{
  border:0; background:transparent; padding:5px 8px 7px; font-size:12.5px; line-height:1.55;
  resize:vertical; min-height:42px; font-family:inherit;
}
.lcellbox textarea.ltxt:focus{outline:none; background:var(--surface)}

/* ---------- 평가 ---------- */
table.plans{border-collapse:separate; border-spacing:0; width:100%; min-width:820px}
table.plans th{
  text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
  font-weight:500; padding:0 8px 7px; border-bottom:1px solid var(--line); white-space:nowrap;
}
table.plans td{border-bottom:1px solid var(--line); padding:3px 4px}
table.plans tr.on td{background:var(--accent-soft)}
table.plans td input, table.plans td select{
  width:100%; border:0; background:transparent; padding:6px 5px; font-size:13.5px;
}
table.plans td input:focus, table.plans td select:focus{outline:none; background:var(--surface); border-radius:5px}

.summary{display:flex; gap:14px; flex-wrap:wrap; align-items:center; padding:10px 12px; margin-bottom:4px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px; font-size:13px; color:var(--ink-2)}
.summary b{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink); font-size:14px}
.gchip{display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:2px 9px; border-radius:99px}
.gchip.accent{background:var(--accent-soft); color:var(--accent)}
.gchip.info{background:var(--info-soft); color:var(--info)}
.gchip.warn{background:var(--warn-soft); color:var(--warn)}
.gchip.danger{background:var(--danger-soft); color:var(--danger)}
.gchip b{color:inherit}

.evalrows{display:flex; flex-direction:column; gap:4px}
.evalrow{display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:3px 0; border-bottom:1px solid var(--line)}
.evalrow:last-child{border-bottom:0}
.evalrow .who{display:flex; align-items:center; gap:7px; width:112px; flex:0 0 112px; font-size:13.5px}
.evalrow .who .no{font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.evalrow .gbtn{
  flex:0 0 auto; width:96px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-3);
  border-radius:99px; padding:5px 10px; font-size:12.5px; font-weight:700; cursor:pointer;
}
.evalrow .gbtn:hover{border-color:var(--line-strong)}
.evalrow .gbtn.accent{background:var(--accent-soft); color:var(--accent); border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.evalrow .gbtn.info{background:var(--info-soft); color:var(--info); border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.evalrow .gbtn.warn{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.evalrow .gbtn.danger{background:var(--danger-soft); color:var(--danger); border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.evalrow .scoreinput{
  flex:0 0 auto; width:74px; text-align:center; font-family:var(--mono); font-variant-numeric:tabular-nums;
  border:1px solid var(--line); background:var(--surface-2); border-radius:7px; padding:6px 8px; font-size:13.5px;
}
.evalrow .scoreinput:focus{outline:none; border-color:var(--accent); background:var(--surface)}
.evalrow .cmt{
  flex:1; min-width:180px; border:0; border-bottom:1px solid var(--line); background:transparent;
  padding:6px 4px; font-size:13.5px;
}
.evalrow .cmt:focus{outline:none; border-bottom-color:var(--accent)}

/* ---------- 업무·예산 ---------- */
.duelist{display:flex; flex-direction:column; gap:5px}
.dueitem{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
  border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:8px 12px; font:inherit;
}
.dueitem:hover{border-color:var(--accent)}
.dueitem .nm{flex:1; min-width:0; font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dueitem .meta{font-size:12px; color:var(--ink-3); white-space:nowrap}
.dd{
  font-family:var(--mono); font-size:11.5px; font-weight:500; padding:2px 8px; border-radius:99px;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-3); white-space:nowrap;
}
.dd.soon{background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 40%,transparent); color:var(--warn); font-weight:700}
.dd.over{background:var(--danger-soft); border-color:color-mix(in srgb,var(--danger) 40%,transparent); color:var(--danger); font-weight:700}
.dueitem .st{font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--surface); color:var(--ink-3); border:1px solid var(--line)}
.dueitem .st.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.dueitem .st.accent{background:var(--accent-soft); color:var(--accent); border-color:transparent}

table.tasks{border-collapse:separate; border-spacing:0; width:100%; min-width:920px}
table.tasks th{
  text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
  font-weight:500; padding:0 8px 7px; border-bottom:1px solid var(--line); white-space:nowrap;
}
table.tasks td{border-bottom:1px solid var(--line); padding:3px 4px; vertical-align:middle}
table.tasks tr.done td{opacity:.55}
table.tasks td input{width:100%; border:0; background:transparent; padding:6px 5px; font-size:13.5px}
table.tasks td input:focus{outline:none; background:var(--accent-soft); border-radius:5px}
table.tasks td input.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
table.tasks td.duecell{display:flex; align-items:center; gap:5px}
table.tasks td.duecell input{width:auto; flex:1; min-width:0; font-family:var(--mono); font-size:12px}
.stbtn{
  width:100%; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-3);
  border-radius:99px; padding:4px 8px; font-size:12px; font-weight:700; cursor:pointer;
}
.stbtn:hover{border-color:var(--line-strong)}
.stbtn.warn{background:var(--warn-soft); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.stbtn.accent{background:var(--accent-soft); color:var(--accent); border-color:color-mix(in srgb,var(--accent) 35%,transparent)}

.bgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:12px}
.bcard{border:1px solid var(--line); border-radius:var(--radius); padding:12px 13px; background:var(--surface-2)}
.bcard .brow{display:flex; align-items:center; gap:6px}
.bcard .brow2{display:flex; align-items:center; gap:6px; margin:4px 0 9px}
.bcard input{border:0; background:transparent; padding:3px 2px; font-size:13px; min-width:0}
.bcard input:focus{outline:none; background:var(--surface); border-radius:4px}
.bcard input.bname{flex:1; font-size:14.5px; font-weight:700; font-family:var(--serif)}
.bcard input.bsrc{flex:1; font-size:12px; color:var(--ink-3)}
.bcard input.bamt{width:96px; text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px}
.bar{height:7px; border-radius:99px; background:var(--line); overflow:hidden}
.bar span{display:block; height:100%; background:var(--accent); border-radius:99px}
.bar.warn span{background:var(--warn)}
.bar.over span{background:var(--danger)}
.bnums{display:flex; gap:12px; align-items:baseline; margin-top:7px; font-size:12px; color:var(--ink-3)}
.bnums b{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink-2); font-size:13px}
.bnums b.neg{color:var(--danger)}
.bnums .pct{margin-left:auto; font-family:var(--mono)}

/* ---------- observations ---------- */
.obs{display:grid; grid-template-columns:230px minmax(0,1fr); gap:16px; align-items:start}
.stulist{display:flex; flex-direction:column; gap:1px; max-height:640px; overflow-y:auto}
.stulist button{display:flex; align-items:center; gap:8px; width:100%; border:0; background:transparent; padding:7px 10px; border-radius:7px; cursor:pointer; text-align:left; color:var(--ink-2)}
.stulist button:hover{background:var(--surface-2)}
.stulist button[aria-current="true"]{background:var(--accent-soft); color:var(--accent); font-weight:700}
.stulist .no{font-family:var(--mono); font-size:11px; color:var(--ink-3); width:20px; text-align:right}
.stulist .ct{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-3); background:var(--surface-2); border-radius:99px; padding:0 7px}
.stulist button[aria-current="true"] .ct, .stulist button[aria-current="true"] .no{color:var(--accent)}

.entry{display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .meta{flex:0 0 84px; display:flex; flex-direction:column; gap:4px}
.entry .dt{font-family:var(--mono); font-size:12px; color:var(--ink-3)}
.entry .cat{font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px; align-self:flex-start; background:var(--accent-soft); color:var(--accent)}
.entry .txt{flex:1; min-width:0; font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-word}
.entry .del{opacity:0; flex:0 0 auto}
.entry:hover .del{opacity:1}
.hit{font-size:12px; color:var(--ink-3); font-family:var(--mono)}

/* ---------- 학생 카드 · 상담 · 마감 집계 ---------- */
.cardgrid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:12px; margin-bottom:14px}
.cbox{border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:10px 12px}
.cbox .ck{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:5px}
.cbox .cv{font-size:14px; color:var(--ink)}
.cbox .cs{font-size:12px; color:var(--ink-3); margin-top:4px}
.cbox .dim{color:var(--ink-3)}
.evtags{display:flex; flex-wrap:wrap; gap:5px}
.evtag{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:99px; padding:2px 4px 2px 9px; background:var(--surface); font-size:12px}
.evtag b{font-weight:500; color:var(--ink-2); max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.evtag em{font-style:normal; font-weight:700; font-size:11.5px; padding:1px 7px; border-radius:99px; background:var(--surface-2); color:var(--ink-3)}
.evtag em.accent{background:var(--accent-soft); color:var(--accent)}
.evtag em.info{background:var(--info-soft); color:var(--info)}
.evtag em.warn{background:var(--warn-soft); color:var(--warn)}
.evtag em.danger{background:var(--danger-soft); color:var(--danger)}
.draftbox{border-top:1px solid var(--line); padding-top:13px}

.csrow{border:1px solid var(--line); border-radius:8px; padding:10px 11px; margin-bottom:9px; background:var(--surface-2)}
.csrow:last-child{margin-bottom:0}
.cshead{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:7px}
.csrow .csdate{border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:4px 8px; font-family:var(--mono); font-size:12px}
.csrow .cssel{border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:4px 8px; font-size:12.5px}
.csrow textarea.input{background:var(--surface)}
.csrow .csfollow{margin-top:6px; background:var(--surface); font-size:13px}

table.closing{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:12px}
table.closing th, table.closing td{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:4px 5px; text-align:center}
table.closing thead th{background:var(--surface-2); font-weight:500; color:var(--ink-2); font-size:11.5px; white-space:nowrap}
table.closing thead tr.sub2 th{font-size:10.5px; color:var(--ink-3); font-weight:400; padding:3px 4px}
table.closing th.nm, table.closing td.nm{
  position:sticky; left:0; background:var(--surface); text-align:left; white-space:nowrap;
  min-width:100px; border-right:1px solid var(--line-strong); padding:4px 9px;
}
table.closing thead th.nm{background:var(--surface-2); z-index:2}
table.closing td.nm .no{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-right:6px}
table.closing td{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink-3); min-width:26px}
table.closing td.has{background:var(--accent-soft); color:var(--accent); font-weight:700}
table.closing td.none.has{background:var(--warn-soft); color:var(--warn)}
table.closing th.none{color:var(--warn)}
table.closing td.tot, table.closing th.tot{background:var(--surface-2); font-weight:700; color:var(--ink-2); min-width:34px}

.warnlist{display:flex; flex-direction:column; gap:6px}
.warnrow{display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:8px;
  background:var(--warn-soft); border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.warnrow .who{display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:500; min-width:104px}
.warnrow .who .no{font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.warnrow .wtxt{font-size:13px; color:var(--warn); font-weight:700}
.reasonrow select.rkind{width:auto; min-width:88px; flex:0 0 auto; padding:6px 8px; font-size:13px}

/* ---------- timetable ---------- */
table.tt{border-collapse:separate; border-spacing:0; width:100%; min-width:560px}
table.tt th, table.tt td{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:0}
table.tt th{background:var(--surface-2); font-size:12px; font-weight:500; color:var(--ink-2); padding:8px 0}
table.tt th.per{width:56px; font-family:var(--mono); color:var(--ink-3); font-size:11px}
table.tt td input{width:100%; border:0; background:transparent; padding:9px 8px; font-size:13.5px; text-align:center}
table.tt td input:focus{outline:none; background:var(--accent-soft)}
table.tt tr:last-child th, table.tt tr:last-child td{border-bottom:0}
table.tt th:last-child, table.tt td:last-child{border-right:0}

/* ---------- seating ---------- */
.board-bar{text-align:center; font-size:12px; letter-spacing:.35em; color:var(--ink-3); text-transform:uppercase; border:1px dashed var(--line-strong); border-radius:7px; padding:8px; margin-bottom:16px; background:var(--surface-2)}
.seatgrid{display:grid; gap:9px; justify-content:center}
.seat{border:1px solid var(--line); background:var(--surface-2); border-radius:8px; min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; cursor:pointer; padding:5px 4px; font-size:13.5px; color:var(--ink)}
.seat:hover{border-color:var(--accent)}
.seat.empty{color:var(--ink-3); border-style:dashed; font-size:12px}
.seat.sel{background:var(--accent-soft); border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.seat .sno{font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.pool{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.pool .seat{min-height:auto; padding:5px 10px; flex-direction:row; gap:6px}

/* ---------- students ---------- */
table.roster{border-collapse:separate; border-spacing:0; width:100%}
table.roster th{text-align:left; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:500; padding:0 8px 7px; border-bottom:1px solid var(--line)}
table.roster td{border-bottom:1px solid var(--line); padding:3px 4px}
table.roster td input{width:100%; border:0; background:transparent; padding:6px 5px; font-size:14px}
table.roster td input:focus{outline:none; background:var(--accent-soft); border-radius:5px}
table.roster td.nocol{width:58px}
table.roster td.nocol input{font-family:var(--mono); text-align:center; color:var(--ink-3); font-size:12.5px}
table.roster td.actcol{width:36px; text-align:right}
table.roster td .btn.ghost{opacity:0}
table.roster tr:hover td .btn.ghost{opacity:1}

/* ---------- board mode ---------- */
.boardmode{position:fixed; inset:0; z-index:50; background:var(--board); color:#F3F6F1; padding:5vh 6vw; overflow-y:auto; display:none; flex-direction:column}
.boardmode.on{display:flex}
.boardmode h2{font-family:var(--serif); font-size:clamp(28px,4.5vw,52px); margin:0 0 4vh; font-weight:700; border-bottom:2px solid rgba(243,246,241,.25); padding-bottom:3vh; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap}
.boardmode h2 small{font-family:var(--mono); font-size:clamp(13px,1.4vw,18px); font-weight:400; opacity:.6}
.boardmode ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2.6vh; flex:1}
.boardmode li{display:flex; gap:20px; align-items:flex-start; font-size:clamp(20px,3vw,38px); line-height:1.45}
.boardmode li b{font-family:var(--mono); font-weight:400; opacity:.45; font-size:.7em; padding-top:.28em}
.boardmode .close{position:absolute; top:18px; right:20px; background:transparent; border:1px solid rgba(243,246,241,.3); color:#F3F6F1; border-radius:7px; padding:6px 13px; cursor:pointer; font-size:13px}

/* ---------- responsive ---------- */
@media (max-width: 900px){
  .today{grid-template-columns:minmax(0,1fr)}
  .obs{grid-template-columns:minmax(0,1fr)}
  .stulist{max-height:200px; flex-direction:row; flex-wrap:wrap; overflow-x:hidden}
  .stulist button{width:auto}
  .ledger{grid-template-columns:1fr 1fr}
  .lcell{border-bottom:1px solid var(--line)}
}
@media (max-width: 760px){
  .shell{grid-template-columns:1fr}
  .rail{position:static; height:auto; flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); padding:10px 12px; gap:4px; align-items:center}
  .brand{padding:0 12px 0 4px; flex:0 0 auto}
  .brand b{font-size:17px}
  .brand span{display:none}
  .navbtn{width:auto; white-space:nowrap; padding:7px 11px}
  .navbtn i{display:none}
  .railfoot{display:none}
  .main{padding-left:16px; padding-right:16px; padding-block:18px 60px}
  .ledger{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <div class="gatecard">
    <div class="brand"><b>우리 반 하루</b><span>Class Log</span></div>
    <div class="panel"><div class="pbody stack">
      <div class="field">
        <label for="gatePw">접속 암호</label>
        <input class="input" type="password" id="gatePw" autocomplete="current-password" placeholder="구글 시트에 설정한 암호">
      </div>
      <button class="btn primary" id="gateGo">열기</button>
      <p id="gateMsg" style="margin:0; font-size:13px; color:var(--danger); min-height:20px"></p>
      <p style="margin:0; font-size:12.5px; color:var(--ink-3); line-height:1.7">
        이 학급일지는 선생님의 구글 시트에 저장됩니다. 암호는 이 기기에만 기억되고, 다른 사람이 주소를 알아도 암호 없이는 아무것도 볼 수 없습니다.
      </p>
      <button class="btn ghost" id="gateLocal" style="font-size:12.5px">연동 없이 이 브라우저에만 저장하며 쓰기</button>
    </div></div>
  </div>
</div>

<div class="shell" id="app" hidden>
  <nav class="rail" aria-label="주요 메뉴">
    <div class="brand"><b>우리 반 하루</b><span>Class Log</span></div>
    <button class="navbtn" data-tab="today" aria-current="true"><i>◆</i>오늘</button>
    <button class="navbtn" data-tab="lesson"><i>▥</i>수업</button>
    <button class="navbtn" data-tab="eval"><i>◈</i>평가</button>
    <button class="navbtn" data-tab="task"><i>✦</i>업무·예산</button>
    <button class="navbtn" data-tab="att"><i>▦</i>출결</button>
    <button class="navbtn" data-tab="obs"><i>✎</i>학생 기록</button>
    <button class="navbtn" data-tab="tt"><i>▤</i>시간표</button>
    <button class="navbtn" data-tab="seat"><i>▣</i>자리배치</button>
    <button class="navbtn" data-tab="stu"><i>☰</i>학생</button>
    <button class="navbtn" data-tab="exp"><i>⤓</i>내보내기</button>
    <button class="navbtn" data-tab="set"><i>⚙</i>설정</button>
    <div class="railfoot"><b id="railClass">학급 정보 없음</b><span id="railCount"></span></div>
  </nav>
  <main class="main">
    <div class="topbar">
      <h1 id="viewTitle">오늘</h1>
      <p id="viewSub"></p>
      <span class="savechip" id="saveChip">불러오는 중…</span>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="boardmode" id="board" role="dialog" aria-label="칠판 모드">
  <button class="close" data-act="board-close">닫기 (Esc)</button>
  <h2 id="boardTitle"></h2>
  <ol id="boardList"></ol>
</div>

<script>
(function(){
"use strict";

/* =======================================================================
   설정 — 배포한 Apps Script 웹앱 주소를 여기에 붙여넣으면 기본값이 됩니다.
   비워 두어도 됩니다. (앱의 설정 탭에서도 넣을 수 있습니다)
   ======================================================================= */
var CONFIG = {

};

/* ===================== utils ===================== */
var DOW = ["일","월","화","수","목","금","토"];
var WX = ["맑음","구름","흐림","비","눈","바람"];
var CATS = ["학습","생활","태도","관계","건강","기타"];
var ATT = {
  "":  {mk:"",   name:""},

};
var CYCLE = ["", "P", "L", "A", "E", "R", "X"];
var NAME2T = {"출석":"P","지각":"L","결석":"A","조퇴":"E","결과":"R","체험":"X",
              "○":"P","지":"L","결":"A","조":"E","과":"R","체":"X"};
/* 등교하지 않은 것으로 세는 상태 */
var ABSENTISH = {"A":1, "X":1};

/* 수행평가 성취도 */

function won(n){
  var v = parseFloat(String(n==null?"":n).replace(/[^0-9.-]/g,""));
  if (isNaN(v)) return 0;
  return v;
}
function fmtWon(n){
  var v = won(n);
  return v.toLocaleString("ko-KR");
}
function dday(due){
  if (!isDate(due)) return null;
  var a = parseISO(todayISO()), b = parseISO(due);
  return Math.round((b - a) / 86400000);
}

function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayISO(){ return iso(new Date()); }
function parseISO(s){ var p=String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function ymOf(s){ return String(s).slice(0,7); }
function dowOf(s){ return parseISO(s).getDay(); }
function fmtK(s){ var d=parseISO(s); return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일"; }
function fmtShort(s){ var d=parseISO(s); return (d.getMonth()+1)+"/"+d.getDate(); }
function shiftDay(s,n){ var d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function shiftMonth(ym,n){ var p=ym.split("-"), d=new Date(+p[0], +p[1]-1+n, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function mondayOf(s){ var d=parseISO(s), w=d.getDay(); d.setDate(d.getDate() - ((w+6)%7)); return iso(d); }
function weekDays(mon){ var out=[]; for (var i=0;i<5;i++) out.push(shiftDay(mon,i)); return out; }
function daysInMonth(ym){ var p=ym.split("-"); return new Date(+p[0], +p[1], 0).getDate(); }
function isDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"").trim()); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

/* ===================== 시트 API ===================== */
var api = {
  url: "",
  token: "",
  call: function(body){
    var self = this;
    if (!self.url) return Promise.reject({code:"no_url", message:"시트 주소가 설정되지 않았습니다"});
    var payload = JSON.stringify(Object.assign({app:"classlog", token:self.token}, body));
    return fetch(self.url, {
      method: "POST",
      /* text/plain 이어야 브라우저가 사전 요청(preflight)을 보내지 않아 Apps Script와 통신됩니다 */
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: payload,
      redirect: "follow"
    }).then(function(r){
      if (!r.ok) throw {code:"http_"+r.status, message:"서버가 "+r.status+" 로 답했습니다"};
      return r.text();
    }).then(function(t){
      var j;
      try{ j = JSON.parse(t); }
      catch(e){ throw {code:"bad_response", message:"응답을 읽지 못했습니다. 배포 설정에서 액세스 권한이 ‘모든 사용자’인지 확인해 주세요."}; }
      if (!j.ok) throw {code:j.error||"error", message:j.message||""};
      return j;
    }).catch(function(err){
      if (err && err.code) throw err;
      throw {code:"network", message:"시트에 연결하지 못했습니다"};
    });
  }
};
function apiMessage(err){
  var c = err && err.code;
  if (c === "bad_token") return "암호가 맞지 않습니다.";
  if (c === "no_token_set") return "시트 쪽에 암호가 아직 설정되지 않았습니다. 안내문의 ‘암호 정하기’ 단계를 마쳐 주세요.";
  if (c === "no_url") return "시트 주소가 설정되지 않았습니다. 설정 탭에서 넣어 주세요.";
  if (c === "network") return "시트에 연결하지 못했습니다. 인터넷 연결과 웹앱 주소를 확인해 주세요.";
  if (c === "bad_response") return err.message || "응답을 읽지 못했습니다.";
  if (String(c).indexOf("http_") === 0) return err.message || "서버가 오류로 답했습니다.";
  return (err && err.message) || "알 수 없는 오류가 났습니다.";
}

var TABS = {
  students:"학생", att:"출결", journal:"학급일지",
  obs:"누가기록", tt:"시간표", seat:"자리배치", info:"학급정보",

  tasks:"업무", budgets:"예산", spends:"예산집행", counsel:"상담기록"
};
var dirty = {}, saveTimer = null, savedAt = null, saving = false, saveFailed = false;

function markDirty(){
  for (var i=0;i<arguments.length;i++) dirty[arguments[i]] = true;
  mirrorLocal();
  setChip("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushSave, 1200);
}
function pushSave(){
  clearTimeout(saveTimer);
  var keys = Object.keys(dirty);
  if (!keys.length){ setChip(); return Promise.resolve(); }
  if (S.mode !== "sheet"){ dirty = {}; savedAt = new Date(); setChip(); return Promise.resolve(); }
  if (saving){ saveTimer = setTimeout(pushSave, 600); return Promise.resolve(); }
  saving = true;
  var tabs = {};
  keys.forEach(function(k){ tabs[TABS[k]] = buildTab(k); });
  dirty = {};
  setChip("saving");
  return api.call({action:"save", tabs:tabs, base:{att:S.baseAtt, obs:S.baseObs}}).then(function(){
    /* 저장한 내용이 새 기준이 됩니다 */
    if (tabs[TABS.att]) S.baseAtt = attKeys();
    if (tabs[TABS.obs]) S.baseObs = obsKeys();
    saving = false; saveFailed = false; savedAt = new Date(); setChip();
  }).catch(function(err){
    saving = false; saveFailed = true;
    keys.forEach(function(k){ dirty[k] = true; });   /* 다음 기회에 다시 보냅니다 */
    S.lastError = apiMessage(err);
    setChip("error");
  });
}
function setChip(state){
  var el = $("#saveChip");
  if (!el) return;
  if (state === "saving"){ el.dataset.state = "saving"; el.textContent = "저장 중…"; el.title = ""; return; }
  if (state === "error" || saveFailed){
    el.dataset.state = "error";
    el.textContent = "시트에 저장 못함 — 눌러 다시 시도";
    el.title = S.lastError || "";
    return;
  }
  if (S.mode !== "sheet"){
    el.dataset.state = "local";
    el.textContent = "이 브라우저에만 저장됨";
    el.title = "설정 탭에서 구글 시트와 연결하면 어느 기기에서나 이어집니다";
    return;
  }
  el.dataset.state = "";
  el.title = "";
  if (savedAt){
    var h = savedAt.getHours(), m = pad(savedAt.getMinutes());
    el.textContent = "시트에 저장됨 " + (h<12?"오전":"오후") + " " + ((h%12)||12) + ":" + m;
  } else el.textContent = "시트 연결됨";
}

function buildTab(key){
  if (key === "students"){
    var r = [["번호","이름","성별","비고"]];
    S.roster.slice().sort(byNo).forEach(function(s){ r.push([s.no, s.name, s.sex||"", s.note||""]); });
    return r;
  }
  if (key === "att"){
    var r2 = [["날짜","요일","번호","이름","구분","사유구분","사유"]];
    Object.keys(S.att).sort().forEach(function(dt){
      S.roster.slice().sort(byNo).forEach(function(s){
        var rec = S.att[dt][s.id];
        if (!rec || !rec.t) return;
        r2.push([dt, DOW[dowOf(dt)], s.no, s.name, ATT[rec.t].name, rec.rk||"", rec.r||""]);
      });
    });
    return r2;
  }
  if (key === "counsel"){
    var rd = [["날짜","번호","이름","대상","방법","내용","후속조치"]];
    S.counsel.slice().sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); })
      .forEach(function(c){
        var s = byId(c.sid);
        if (!s || !String(c.text||"").trim()) return;
        rd.push([c.date||"", s.no, s.name, c.target||"", c.way||"", c.text, c.follow||""]);
      });
    return rd;
  }
  if (key === "journal"){
    var r3 = [["날짜","요일","날씨","알림장","할 일","일지","행사"]];
    Object.keys(S.days).sort().forEach(function(dt){
      var d = S.days[dt];
      var notices = (d.notices||[]).filter(nonEmpty).map(function(x,i){ return (i+1)+". "+x.t; }).join("\n");
      var todos = (d.todos||[]).filter(nonEmpty).map(function(x){ return (x.done?"[완료] ":"[ ] ")+x.t; }).join("\n");
      if (!notices && !todos && !(d.diary||"").trim() && !d.w && !(d.event||"").trim()) return;
      r3.push([dt, DOW[dowOf(dt)], d.w||"", notices, todos, d.diary||"", d.event||""]);
    });
    return r3;
  }
  if (key === "lessons"){
    var r7 = [["날짜","요일","교시","교과","학습내용","비고"]];
    Object.keys(S.lessons).sort().forEach(function(dt){
      var day = S.lessons[dt];
      Object.keys(day).sort(function(a,b){ return a-b; }).forEach(function(p){
        var c = day[p];
        if (!c) return;
        if (!String(c.sub||"").trim() && !String(c.txt||"").trim() && !String(c.note||"").trim()) return;
        r7.push([dt, DOW[dowOf(dt)], p, c.sub||"", c.txt||"", c.note||""]);
      });
    });
    return r7;
  }
  if (key === "plans"){
    var r8 = [["교과","평가명","영역·단원","성취기준","평가방법","시기","구분","비고"]];
    S.plans.forEach(function(p){
      if (!String(p.name||"").trim()) return;
      r8.push([p.subject||"", p.name, p.unit||"", p.standard||"", p.method||"", p.term||"", p.kind||"수행", p.note||""]);
    });
    return r8;
  }
  if (key === "tasks"){
    var ra = [["등록일","구분","업무명","담당","마감일","상태","관련예산","문서번호","링크","메모"]];
    S.tasks.forEach(function(t){
      if (!String(t.name||"").trim()) return;
      ra.push([t.reg||"", t.kind||"", t.name, t.owner||"", t.due||"", t.status||"대기",
               t.budget||"", t.docno||"", t.link||"", t.memo||""]);
    });
    return ra;
  }
  if (key === "budgets"){
    var rb = [["사업명","재원","배정액","집행액","잔액","비고"]];
    S.budgets.forEach(function(b){
      if (!String(b.name||"").trim()) return;
      var used = spentOn(b.name);
      rb.push([b.name, b.source||"", won(b.amount), used, won(b.amount)-used, b.note||""]);
    });
    return rb;
  }
  if (key === "spends"){
    var rc = [["날짜","사업명","내용","금액","증빙","비고"]];
    S.spends.slice().sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); })
      .forEach(function(x){
        if (!String(x.item||"").trim() && !won(x.amount)) return;
        rc.push([x.date||"", x.budget||"", x.item||"", won(x.amount), x.proof||"", x.note||""]);
      });
    return rc;
  }
  if (key === "scores"){
    var r9 = [["평가명","번호","이름","성취도","점수","관찰내용"]];
    S.plans.forEach(function(p){
      var bag = S.scores[p.name];
      if (!bag) return;
      S.roster.slice().sort(byNo).forEach(function(s){
        var v = bag[s.id];
        if (!v) return;
        if (!String(v.g||"").trim() && !String(v.s||"").trim() && !String(v.c||"").trim()) return;
        r9.push([p.name, s.no, s.name, v.g||"", v.s||"", v.c||""]);
      });
    });
    return r9;
  }
  if (key === "obs"){
    var r4 = [["번호","이름","날짜","영역","내용"]];
    S.roster.slice().sort(byNo).forEach(function(s){
      (S.obs[s.id]||[]).slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; })
        .forEach(function(e){ r4.push([s.no, s.name, e.date, e.cat, e.text]); });
    });
    return r4;
  }
  if (key === "tt"){
    var r5 = [["교시","월","화","수","목","금"]];
    for (var p=0;p<(S.tt.periods||7);p++){
      var row = [(p+1)+"교시"];
      for (var d2=0; d2<5; d2++) row.push((S.tt.grid[d2] && S.tt.grid[d2][p]) || "");
      r5.push(row);
    }
    return r5;
  }
  if (key === "seat"){
    var r6 = [["첫 줄이 칠판 쪽입니다 · 칸에 학생 번호를 적으면 그대로 반영됩니다"]];
    for (var y=0;y<S.seat.rows;y++){
      var rr = [];
      for (var x=0;x<S.seat.cols;x++){
        var sid = S.seat.cells[y*S.seat.cols+x], st = sid ? byId(sid) : null;
        rr.push(st ? st.no : "");
      }
      r6.push(rr);
    }
    return r6;
  }
  return [["항목","값"],
    ["학교", S.cls.school||""], ["학년", S.cls.grade||""],
    ["반", S.cls.klass||""], ["담임", S.cls.teacher||""]];
}
function nonEmpty(x){ return x && x.t && String(x.t).trim(); }
function byNo(a,b){ return (+a.no||0)-(+b.no||0); }
function attKeys(){
  var out = [];
  Object.keys(S.att).forEach(function(dt){
    S.roster.forEach(function(s){
      var rec = S.att[dt][s.id];
      if (rec && rec.t) out.push(dt+"|"+s.no);
    });
  });
  return out;
}
function obsKeys(){
  var out = [];
  S.roster.forEach(function(s){
    (S.obs[s.id]||[]).forEach(function(e){ out.push(s.no+"|"+e.date+"|"+e.text); });
  });
  return out;
}

/* ===================== 시트 → 메모리 ===================== */
function hydrate(data){
  var t = data && data.tabs ? data.tabs : {};
  S.sheetUrl = (data && data.sheetUrl) || "";

  var info = t[TABS.info] || [];
  info.slice(1).forEach(function(r){
    var k = String(r[0]||"").trim(), v = String(r[1]==null?"":r[1]).trim();
    if (k === "학교") S.cls.school = v;
    else if (k === "학년") S.cls.grade = v;
    else if (k === "반") S.cls.klass = v;
    else if (k === "담임") S.cls.teacher = v;
  });

  var st = (t[TABS.students] || []).slice(1)
    .map(function(r){ return {no: String(r[0]||"").trim(), name: String(r[1]||"").trim(),
                              sex: String(r[2]||"").trim(), note: String(r[3]||"").trim()}; })
    .filter(function(s){ return s.name; });
  if (st.length){
    S.roster = st.map(function(s,i){
      var no = parseInt(s.no,10); if (isNaN(no)) no = i+1;
      return {id:"n"+no, no:no, name:s.name, sex:s.sex, note:s.note};
    });
    S.demo = false;
  } else {
    S.roster = demoRoster(); S.demo = true;
  }
  var byNoMap = {};
  S.roster.forEach(function(s){ byNoMap[s.no] = s.id; });

  S.att = {}; S.baseAtt = [];
  (t[TABS.att] || []).slice(1).forEach(function(r){
    var dt = String(r[0]||"").trim();
    if (!isDate(dt)) return;
    var no = parseInt(r[2],10);
    var sid = byNoMap[no];
    if (!sid) return;
    var code = NAME2T[String(r[4]||"").trim()];
    if (!code) return;
    if (!S.att[dt]) S.att[dt] = {};
    /* 예전 시트는 6번째 칸이 「사유」였습니다. 분류 낱말이 아니면 사유로 봅니다. */
    var c5 = String(r[5]==null?"":r[5]).trim(), c6 = String(r[6]==null?"":r[6]).trim();
    var rk = "", rs = "";
    if (REASON_KINDS.indexOf(c5) >= 0){ rk = c5; rs = c6; }
    else rs = (c5 && c6) ? (c5+" "+c6) : (c5 || c6);
    S.att[dt][sid] = {t:code, rk:rk, r:rs};
    S.baseAtt.push(dt+"|"+no);
  });

  S.days = {};
  (t[TABS.journal] || []).slice(1).forEach(function(r){
    var dt = String(r[0]||"").trim();
    if (!isDate(dt)) return;
    S.days[dt] = {
      w: String(r[2]||"").trim(),
      notices: splitLines(r[3]).map(function(x){ return {id:uid(), t:x.replace(/^\s*\d+\s*[.)]\s*/,"")}; }),
      todos: splitLines(r[4]).map(function(x){
        var done = /^\s*\[\s*(완료|v|V|x|X|✓)\s*\]/.test(x);
        return {id:uid(), t:x.replace(/^\s*\[[^\]]*\]\s*/,""), done:done};
      }),
      diary: String(r[5]==null?"":r[5]),
      event: String(r[6]==null?"":r[6])
    };
  });

  S.lessons = {};
  (t[TABS.lessons] || []).slice(1).forEach(function(r){
    var dt = String(r[0]||"").trim();
    var p = parseInt(r[2],10);
    if (!isDate(dt) || isNaN(p)) return;
    if (!S.lessons[dt]) S.lessons[dt] = {};
    S.lessons[dt][p] = {
      sub: String(r[3]==null?"":r[3]).trim(),
      txt: String(r[4]==null?"":r[4]),
      note: String(r[5]==null?"":r[5])
    };
  });

  S.plans = (t[TABS.plans] || []).slice(1).map(function(r){
    return {
      id: uid(),
      subject: String(r[0]||"").trim(),
      name: String(r[1]||"").trim(),
      unit: String(r[2]||"").trim(),
      standard: String(r[3]==null?"":r[3]),
      method: String(r[4]||"").trim(),
      term: String(r[5]||"").trim(),
      kind: (String(r[6]||"").trim() === "단원") ? "단원" : "수행",
      note: String(r[7]==null?"":r[7])
    };
  }).filter(function(p){ return p.name; });

  S.counsel = (t[TABS.counsel] || []).slice(1).map(function(r){
    var sid = byNoMap[parseInt(r[1],10)];
    if (!sid) return null;
    return { id: uid(), sid: sid, date: String(r[0]||"").trim(),
             target: String(r[3]||"").trim(), way: String(r[4]||"").trim(),
             text: String(r[5]==null?"":r[5]), follow: String(r[6]==null?"":r[6]) };
  }).filter(function(c){ return c && String(c.text||"").trim(); });

  S.tasks = (t[TABS.tasks] || []).slice(1).map(function(r){
    return {
      id: uid(), reg: String(r[0]||"").trim(), kind: String(r[1]||"").trim(),
      name: String(r[2]||"").trim(), owner: String(r[3]||"").trim(),
      due: String(r[4]||"").trim(), status: STATUSES.indexOf(String(r[5]||"").trim())>=0 ? String(r[5]).trim() : "대기",
      budget: String(r[6]||"").trim(), docno: String(r[7]||"").trim(),
      link: String(r[8]||"").trim(), memo: String(r[9]==null?"":r[9])
    };
  }).filter(function(x){ return x.name; });

  S.budgets = (t[TABS.budgets] || []).slice(1).map(function(r){
    return { id: uid(), name: String(r[0]||"").trim(), source: String(r[1]||"").trim(),
             amount: won(r[2]), note: String(r[5]==null?"":r[5]) };
  }).filter(function(x){ return x.name; });

  S.spends = (t[TABS.spends] || []).slice(1).map(function(r){
    return { id: uid(), date: String(r[0]||"").trim(), budget: String(r[1]||"").trim(),
             item: String(r[2]||"").trim(), amount: won(r[3]),
             proof: String(r[4]||"").trim(), note: String(r[5]==null?"":r[5]) };
  }).filter(function(x){ return x.item || x.amount; });

  S.scores = {};
  (t[TABS.scores] || []).slice(1).forEach(function(r){
    var name = String(r[0]||"").trim();
    var sid = byNoMap[parseInt(r[1],10)];
    if (!name || !sid) return;
    if (!S.scores[name]) S.scores[name] = {};
    S.scores[name][sid] = {
      g: String(r[3]||"").trim(),
      s: String(r[4]==null?"":r[4]).trim(),
      c: String(r[5]==null?"":r[5])
    };
  });

  S.obs = {}; S.baseObs = [];
  (t[TABS.obs] || []).slice(1).forEach(function(r){
    var no = parseInt(r[0],10);
    var sid = byNoMap[no];
    var dt = String(r[2]||"").trim();
    var txt = String(r[4]==null?"":r[4]).trim();
    if (!sid || !txt) return;
    if (!S.obs[sid]) S.obs[sid] = [];
    S.obs[sid].push({id:uid(), date: isDate(dt)?dt:todayISO(), cat:String(r[3]||"기타").trim()||"기타", text:txt});
    S.baseObs.push(no+"|"+dt+"|"+txt);
  });

  var ttRows = (t[TABS.tt] || []).slice(1).filter(function(r){ return String(r[0]||"").trim() !== ""; });
  if (ttRows.length){
    var grid = [[],[],[],[],[]];
    ttRows.forEach(function(r){
      for (var d=0; d<5; d++) grid[d].push(String(r[d+1]==null?"":r[d+1]).trim());
    });
    S.tt = {periods: Math.min(9, Math.max(3, ttRows.length)), grid: grid};
  } else {
    S.tt = {periods:7, grid: S.demo ? DEMO_TT.map(function(x){ return x.slice(); }) : blankTT()};
  }
  growTT();

  var seatRows = (t[TABS.seat] || []).slice(1);
  if (seatRows.length){
    var cols = 0;
    seatRows.forEach(function(r){ cols = Math.max(cols, r.length); });
    cols = Math.max(1, cols);
    var cells = [];
    seatRows.forEach(function(r){
      for (var x=0;x<cols;x++){
        var v = parseInt(r[x],10);
        cells.push(byNoMap[v] || null);
      }
    });
    S.seat = {rows: seatRows.length, cols: cols, cells: cells};
  } else {
    S.seat = {rows:5, cols:6, cells: autoSeats(5,6,S.roster)};
  }
}
function splitLines(v){
  return String(v==null?"":v).split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
}
function hydrateLocal(snap){
  S.cls = Object.assign(S.cls, snap.cls||{});
  S.roster = (snap.roster && snap.roster.length) ? snap.roster : demoRoster();
  S.demo = (snap.roster && snap.roster.length) ? !!snap.demo : true;
  S.days = snap.days || {};
  S.att = snap.att || {};
  S.obs = snap.obs || {};
  S.tt = snap.tt && snap.tt.grid ? snap.tt : {periods:7, grid: S.demo ? DEMO_TT.map(function(x){return x.slice();}) : blankTT()};
  growTT();
  S.seat = snap.seat && snap.seat.cells ? snap.seat : {rows:5, cols:6, cells:autoSeats(5,6,S.roster)};
  S.lessons = snap.lessons || {};
  S.plans = snap.plans || [];
  S.scores = snap.scores || {};
  S.tasks = snap.tasks || [];
  S.budgets = snap.budgets || [];
  S.spends = snap.spends || [];
  S.counsel = snap.counsel || [];
}
function autoSeats(rows, cols, roster){
  var cells=[], n=rows*cols, list=(roster||[]).slice().sort(byNo);
  for (var i=0;i<n;i++) cells.push(list[i] ? list[i].id : null);
  return cells;
}
function growTT(){
  for (var d=0; d<5; d++){
    if (!S.tt.grid[d]) S.tt.grid[d] = [];
    while (S.tt.grid[d].length < (S.tt.periods||7)) S.tt.grid[d].push("");
  }
}

/* ===================== 접근자 ===================== */
function day(dt){
  if (!S.days[dt]) S.days[dt] = {w:"", notices:[], todos:[], diary:""};
  var d = S.days[dt];
  if (!d.notices) d.notices = [];
  if (!d.todos) d.todos = [];
  return d;
}
function attDay(dt){
  if (!S.att[dt]) S.att[dt] = {};
  return S.att[dt];
}
function attOf(dt, sid){
  var a = S.att[dt];
  return (a && a[sid] && a[sid].t) || "";
}
function byId(sid){
  for (var i=0;i<S.roster.length;i++) if (S.roster[i].id===sid) return S.roster[i];
  return null;
}

/* ===================== boot ===================== */
function boot(){
  api.url = lsGet("classlog:url") || CONFIG.API_URL || "";
  api.token = lsGet("classlog:token") || "";
  var snap = readLocal();

  if (!api.url){
    S.mode = "local";
    if (snap) hydrateLocal(snap); else hydrateLocal({});
    start();
    return;
  }
  if (!api.token){ showGate(""); return; }
  loadFromSheet().then(start).catch(function(err){
    if (err && err.code === "bad_token"){ showGate(apiMessage(err)); return; }
    /* 연결이 안 되면 마지막으로 본 내용으로라도 일합니다 */
    S.mode = "local"; saveFailed = true; S.lastError = apiMessage(err);
    hydrateLocal(snap || {});
    start();
  });
}
function loadFromSheet(){
  return api.call({action:"load"}).then(function(j){
    S.mode = "sheet"; S.online = true; saveFailed = false;
    hydrate(j.data);
    mirrorLocal();
  });
}
function start(){
  $("#gate").hidden = true;
  $("#app").hidden = false;
  savedAt = null;
  render();
  setChip();
}
function showGate(msg){
  $("#app").hidden = true;
  $("#gate").hidden = false;
  $("#gateMsg").textContent = msg || "";
  var i = $("#gatePw"); if (i) i.focus();
}
$("#gateGo").addEventListener("click", tryGate);
$("#gatePw").addEventListener("keydown", function(e){ if (e.key === "Enter") tryGate(); });
$("#gateLocal").addEventListener("click", function(){
  S.mode = "local";
  hydrateLocal(readLocal() || {});
  start();
});
function tryGate(){
  var pw = $("#gatePw").value;
  if (!pw){ $("#gateMsg").textContent = "암호를 입력해 주세요."; return; }
  $("#gateGo").disabled = true; $("#gateGo").textContent = "확인 중…";
  api.token = pw;
  loadFromSheet().then(function(){
    lsSet("classlog:token", pw);
    $("#gateGo").disabled = false; $("#gateGo").textContent = "열기";
    start();
  }).catch(function(err){
    api.token = "";
    $("#gateGo").disabled = false; $("#gateGo").textContent = "열기";
    $("#gateMsg").textContent = apiMessage(err);
  });
}

function attCounts(dt){
  var c = {P:0,L:0,A:0,E:0,R:0,X:0};
  S.roster.forEach(function(s){ var t = attOf(dt, s.id); if (t && c[t]!==undefined) c[t]++; });
  c.total = S.roster.length;
  c.present = c.total - c.A - c.X;   /* 등교한 인원 */
  c.marked = c.P + c.L + c.A + c.E + c.R + c.X;
  return c;
}
function carryTodos(){
  var out = [];
  Object.keys(S.days).sort().forEach(function(k){
    if (k >= S.date) return;
    (S.days[k].todos||[]).forEach(function(t){
      if (!t.done && t.t && t.t.trim()) out.push({date:k, id:t.id, text:t.t});
    });
  });
  return out.slice(-8);
}

function ensureLesson(dt, p){
  if (!S.lessons[dt]) S.lessons[dt] = {};
  if (!S.lessons[dt][p]) S.lessons[dt][p] = {sub:"", txt:"", note:""};
  return S.lessons[dt][p];
}
function lessonCell(dt, p){
  var day = S.lessons[dt];
  return (day && day[p]) ? day[p] : {sub:"", txt:"", note:""};
}
function ttSubject(dt, p){
  var w = dowOf(dt);
  if (w < 1 || w > 5) return "";
  return (S.tt.grid[w-1] && S.tt.grid[w-1][p-1]) || "";
}
function attLine(dt){
  var out = [];
  S.roster.slice().sort(byNo).forEach(function(s){
    var rec = (S.att[dt]||{})[s.id];
    if (!rec || !rec.t || rec.t === "P") return;
    out.push(s.name + "(" + ATT[rec.t].name + (rec.r ? " · "+rec.r : "") + ")");
  });
  return out;
}

/* ===================== view: 평가 ===================== */
function planByName(name){
  for (var i=0;i<S.plans.length;i++) if (S.plans[i].name === name) return S.plans[i];
  return null;
}
function scoreOf(name, sid){
  var bag = S.scores[name];
  return (bag && bag[sid]) ? bag[sid] : {g:"", s:"", c:""};
}
function ensureScore(name, sid){
  if (!S.scores[name]) S.scores[name] = {};
  if (!S.scores[name][sid]) S.scores[name][sid] = {g:"", s:"", c:""};
  return S.scores[name][sid];
}
function evalSummaryInner(cur){
  if (!cur) return "";
  if (cur.kind === "단원"){
    var nums = [];
    S.roster.forEach(function(s){
      var v = parseFloat(scoreOf(cur.name, s.id).s);
      if (!isNaN(v)) nums.push(v);
    });
    var avg = nums.length ? (nums.reduce(function(a,b){ return a+b; },0)/nums.length) : null;
    return '<span><b>'+nums.length+'</b>명 입력</span>'+
      '<span>평균 <b>'+(avg==null?'—':avg.toFixed(1))+'</b></span>'+
      '<span>최고 <b>'+(nums.length?Math.max.apply(null,nums):'—')+'</b></span>'+
      '<span>최저 <b>'+(nums.length?Math.min.apply(null,nums):'—')+'</b></span>';
  }
  var dist = {}, done = 0;
  GRADES.forEach(function(g){ dist[g] = 0; });
  S.roster.forEach(function(s){
    var g = scoreOf(cur.name, s.id).g;
    if (g && dist[g] !== undefined){ dist[g]++; done++; }
  });
  return '<span><b>'+done+'</b> / '+S.roster.length+'명 입력</span>'+
    GRADES.map(function(g){
      return '<span class="gchip '+GRADE_COLOR[g]+'">'+g+' <b>'+dist[g]+'</b></span>';
    }).join("");
}
function updateEvalSummary(){
  var el = $("#evalSummary");
  if (el) el.innerHTML = evalSummaryInner(planByName(S.selPlan));
}

  var h = demoBanner();
  if (!S.selPlan || !planByName(S.selPlan)) S.selPlan = S.plans.length ? S.plans[0].name : "";

/* 눈여겨볼 학생 — 연속 결석, 지각·결석 누적 */
function attWarnings(){
  var dates = Object.keys(S.att).sort();
  var out = [];
  S.roster.slice().sort(byNo).forEach(function(s){
    var cnt = {A:0, L:0, X:0};
    var run = 0, maxRun = 0, prev = null;
    dates.forEach(function(dt){
      var rec = S.att[dt][s.id];
      var t = rec && rec.t;
      if (t && cnt[t] !== undefined) cnt[t]++;
      if (t === "A"){
        if (prev && dayGap(prev, dt) <= 3) run++; else run = 1;
        prev = dt;
        if (run > maxRun) maxRun = run;
      }
    });
    var msgs = [];
    if (maxRun >= 3) msgs.push("결석 "+maxRun+"일 연속");
    if (cnt.A >= 5) msgs.push("결석 누적 "+cnt.A+"일");
    if (cnt.L >= 5) msgs.push("지각 누적 "+cnt.L+"회");
    if (msgs.length) out.push({s:s, msg: msgs.join(" · ")});
  });
  return out;
}
function dayGap(a, b){
  return Math.abs(Math.round((parseISO(b) - parseISO(a)) / 86400000));
}

/* ===================== 학생 카드 ===================== */
function studentAttSummary(sid){
  var c = {A:0,L:0,E:0,R:0,X:0}, byKind = {};
  Object.keys(S.att).forEach(function(dt){
    var rec = S.att[dt][sid];
    if (!rec || !rec.t || rec.t === "P") return;
    if (c[rec.t] !== undefined) c[rec.t]++;
    var k = rec.rk || "미분류";
    byKind[k] = (byKind[k]||0) + 1;
  });
  return {c:c, byKind:byKind};
}
function studentEvals(sid){
  var out = [];
  S.plans.forEach(function(p){
    var v = (S.scores[p.name]||{})[sid];
    if (!v || (!v.g && !v.s && !v.c)) return;
    out.push({plan:p, v:v});
  });
  return out;
}

/* 클립보드 복사 — 보안 제한이 있는 곳에서도 되도록 두 가지를 씁니다 */
function copyText(text, btn, restore){
  function done(ok){
    if (!btn) return;
    btn.textContent = ok ? "복사됨" : "복사 실패";
    setTimeout(function(){ btn.textContent = restore || "복사"; }, 1500);
  }
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(fallbackCopy(text)); });
      return;
    }
  }catch(e){}
  done(fallbackCopy(text));
}
function fallbackCopy(text){
  try{
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

/* 평어 초안 — 쌓인 기록을 모아 시트 쪽 AI에 보냅니다 */

    render(); return;
  }
  var a = studentAttSummary(s.id);
  var facts = {
    grade: (S.cls.grade ? S.cls.grade + "학년" : "초등학교"),
    att: Object.keys(a.byKind).map(function(k){ return k+" "+a.byKind[k]+"회"; }).join(", ") || "특이사항 없음",
    evals: studentEvals(s.id).map(function(e){
      var lab = e.plan.kind === "단원" ? (e.v.s ? e.v.s+"점" : "") : (e.v.g || "");
      return [e.plan.subject, e.plan.name, lab, e.v.c].filter(Boolean).join(" / ");
    }),
    obs: (S.obs[s.id]||[]).slice().sort(function(x,y){ return String(x.date).localeCompare(String(y.date)); })
      .map(function(o){ return o.date+" ["+o.cat+"] "+o.text; }),
    counsel: S.counsel.filter(function(c){ return c.sid === s.id; })
      .map(function(c){ return c.date+" "+(c.target||"")+" "+(c.way||"")+" — "+c.text; })
  };
  if (!facts.evals.length && !facts.obs.length && !facts.counsel.length){
    S.cardDraft = "이 학생에 대해 쌓인 기록이 아직 없습니다. 누가기록이나 평가를 먼저 남겨 주세요.";
    render(); return;
  }
  S.cardBusy = true; S.cardDraft = ""; render();
  api.call({action:"comment", mode:S.cardMode, facts:facts})
    .then(function(j){
      S.cardBusy = false;
      S.cardDraft = j.text || "";
      render();
    })
    .catch(function(err){
      S.cardBusy = false;
      S.cardDraft = (err && err.code === "no_ai_key")
        ? "시트에 AI 키가 아직 없습니다. 스프레드시트 메뉴 → 우리반 → 공문 자동입력 → 설정에서 넣어 주세요."
        : "초안을 쓰지 못했습니다. " + apiMessage(err);
      render();
    });
}

function acadYear(){ var d = new Date(); return d.getMonth()+1 >= 3 ? d.getFullYear() : d.getFullYear()-1; }
function monthList(preset, oneMonth){
  var y = acadYear(), out = [], i;
  if (preset === "month") return [oneMonth || ymOf(todayISO())];
  if (preset === "sem1"){ for (i=3;i<=8;i++) out.push(y+"-"+pad(i)); return out; }
  if (preset === "sem2"){
    for (i=9;i<=12;i++) out.push(y+"-"+pad(i));
    for (i=1;i<=2;i++) out.push((y+1)+"-"+pad(i));
    return out;
  }
  for (i=3;i<=12;i++) out.push(y+"-"+pad(i));
  for (i=1;i<=2;i++) out.push((y+1)+"-"+pad(i));
  return out;
}

function openBoard(){
  var d = day(S.date);
  var items = d.notices.filter(function(n){ return n.t && n.t.trim(); });
  $("#boardTitle").innerHTML = '알림장 <small>'+fmtK(S.date)+' '+DOW[dowOf(S.date)]+'요일</small>';
  $("#boardList").innerHTML = items.length
    ? items.map(function(n,i){ return '<li><b>'+(i+1)+'</b><span>'+esc(n.t)+'</span></li>'; }).join("")
    : '<li><span style="opacity:.5">적어 둔 알림장이 없습니다.</span></li>';
  $("#board").classList.add("on");
}
function closeBoard(){ $("#board").classList.remove("on"); }

/* ===================== actions ===================== */
function cycleAtt(dt, sid){
  var a = attDay(dt);
  var cur = (a[sid] && a[sid].t) || "";
  var next = CYCLE[(CYCLE.indexOf(cur)+1) % CYCLE.length];
  if (!next) delete a[sid];
  else a[sid] = {t:next, r:(a[sid] && a[sid].r) || ""};
  if (!Object.keys(a).length) delete S.att[dt];
  markDirty("att");
  return next;
}

function doConnect(btn){
  var url = ($("#setUrl").value||"").trim();
  var pw = $("#setPw").value||"";
  var msg = $("#connMsg");
  if (!url || !pw){ msg.textContent = "웹앱 주소와 암호를 모두 넣어 주세요."; return; }
  btn.disabled = true; btn.textContent = "연결 중…";
  api.url = url; api.token = pw;
  api.call({action:"ping"}).then(function(){
    lsSet("classlog:url", url);
    lsSet("classlog:token", pw);
    S.mode = "sheet"; saveFailed = false;
    ["students","att","journal","obs","tt","seat","info"].forEach(function(k){ dirty[k] = true; });
    return pushSave().then(loadFromSheet);
  }).then(function(){
    btn.disabled = false; btn.textContent = "연결하고 지금 기록 올리기";
    render();
  }).catch(function(err){
    S.mode = "local"; api.token = "";
    btn.disabled = false; btn.textContent = "연결하고 지금 기록 올리기";
    var m = $("#connMsg"); if (m) m.textContent = apiMessage(err);
  });
}
function resizeSeats(rows, cols){
  var old = S.seat, cells = [];
  for (var r=0;r<rows;r++){
    for (var c=0;c<cols;c++) cells.push((r<old.rows && c<old.cols) ? old.cells[r*old.cols+c] : null);
  }
  S.seat = {rows:rows, cols:cols, cells:cells};
}

    else {
      lc.txt = el.value;
      /* 내용을 적었는데 교과가 비어 있으면 시간표 과목을 넣어 둡니다 */
      if (el.value.trim() && !String(lc.sub||"").trim()) lc.sub = ttSubject(el.dataset.d, +el.dataset.p);
    }
    markDirty("lessons"); return;
  }
  if (a === "sc-num" || a === "sc-cmt"){
    var sr = ensureScore(S.selPlan, el.dataset.sid);
    if (a === "sc-num"){ sr.s = el.value.replace(/[^0-9.]/g, ""); updateEvalSummary(); }
    else sr.c = el.value;
    markDirty("scores"); return;
  }
  if (a === "task"){
    var tk = S.tasks.filter(function(x){ return x.id === el.dataset.id; })[0];
    if (!tk) return;
    tk[el.dataset.k] = el.value;
    markDirty("tasks");
    if (el.dataset.k === "due"){
      var cell = el.parentNode;
      var badge = cell.querySelector(".dd");
      var lab = ddayLabel(el.value);
      if (badge){ badge.textContent = lab.txt; badge.className = "dd " + lab.cls; }
      else if (lab.txt){
        var sp = document.createElement("span");
        sp.className = "dd " + lab.cls; sp.textContent = lab.txt;
        cell.appendChild(sp);
      }
    }
    return;
  }
  if (a === "bg"){
    var bg = S.budgets.filter(function(x){ return x.id === el.dataset.id; })[0];
    if (!bg) return;
    if (el.dataset.k === "amount") bg.amount = won(el.value);
    else bg[el.dataset.k] = el.value;
    markDirty("budgets"); return;
  }
  if (a === "sp"){
    var sp2 = S.spends.filter(function(x){ return x.id === el.dataset.id; })[0];
    if (!sp2) return;
    if (el.dataset.k === "amount") sp2.amount = won(el.value);
    else sp2[el.dataset.k] = el.value;
    markDirty("spends", "budgets"); return;
  }
  if (a === "plan"){
    var pp = S.plans.filter(function(x){ return x.id === el.dataset.id; })[0];
    if (!pp) return;
    var k = el.dataset.k;
    if (k === "name"){
      var oldName = pp.name, newName = el.value;
      if (S.scores[oldName] && oldName !== newName){
        S.scores[newName] = S.scores[oldName];
        delete S.scores[oldName];
        markDirty("scores");
      }
      if (S.selPlan === oldName) S.selPlan = newName;
      pp.name = newName;
    } else pp[k] = el.value;
    markDirty("plans"); return;
  }
  if (a === "cls"){ S.cls[el.dataset.k] = el.value; markDirty("info"); updateRail(); return; }
  if (a === "stu-name" || a === "stu-note" || a === "stu-no"){
    var s = byId(el.dataset.sid);
    if (!s) return;
    if (a === "stu-name") s.name = el.value;
    else if (a === "stu-note") s.note = el.value;
    else s.no = el.value.replace(/\D/g,"") || 0;
    S.demo = false; markDirty("students"); return;
  }
}, false);

document.addEventListener("change", function(e){
  var el = e.target, a = el.dataset ? el.dataset.act : null;
  if (a === "todo-done"){
    day(S.date).todos.forEach(function(t){ if (t.id===el.dataset.id) t.done = el.checked; });
    markDirty("journal"); render(); return;
  }
  /* 금액 칸은 입력이 끝나면 천 단위로 보기 좋게 바꿔 둡니다 (화면은 다시 그리지 않습니다) */
  if ((a === "bg" && el.dataset.k === "amount") || (a === "sp" && el.dataset.k === "amount")){
    var v = won(el.value);
    el.value = v ? fmtWon(v) : "";
    refreshBudgetNums(); return;
  }
  if (a === "sp" && el.dataset.k === "budget"){ refreshBudgetNums(); return; }
  if (el.id === "dateInput"){ if (el.value) { S.date = el.value; render(); } return; }
  if (el.id === "expPreset"){ S.expPreset = el.value; render(); return; }
  if (el.id === "expMonth"){ if (el.value) S.expMonth = el.value; return; }
  if (el.id === "evalPick"){ S.selPlan = el.value; render(); return; }
  if (el.id === "cardMode"){ S.cardMode = el.value; return; }
  if (a === "att-rkind"){
    var ar = (S.att[S.date]||{})[el.dataset.sid];
    if (ar){ ar.rk = el.value; markDirty("att"); }
    return;
  }
  if (a === "cs" && (el.dataset.k === "target" || el.dataset.k === "way")){
    var c2 = S.counsel.filter(function(x){ return x.id === el.dataset.id; })[0];
    if (c2){ c2[el.dataset.k] = el.value; markDirty("counsel"); }
    return;
  }
  if (a === "plan" && el.dataset.k === "kind"){
    var pk = S.plans.filter(function(x){ return x.id === el.dataset.id; })[0];
    if (pk){ pk.kind = el.value; markDirty("plans"); render(); }
    return;
  }
  if (a === "stu-sex"){
    var sx = byId(el.dataset.sid);
    if (sx){ sx.sex = el.value; S.demo = false; markDirty("students"); }
    return;
  }
}, false);
